<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>INTERSTELLAR → TENET → DUNKIRK — Time Study</title>
<style>
  *{box-sizing:border-box}
  html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
  }
  html{
    overflow-x:hidden;
    overflow-y:scroll;
    scroll-behavior:auto;
  }
  body{overflow:visible}

  /* One parent-owned finite timeline */
  #scrollSpace{
    width:100%;
    height:4450vh;
    background:#000;
  }

  .project-layer{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#000;
    pointer-events:none;
    will-change:opacity,filter,transform;
    transform:translateZ(0);
  }

  #interstellarLayer{
    z-index:2;
    opacity:1;
    filter:brightness(1) blur(0px);
  }

  #tenetLayer{
    z-index:3;
    opacity:0;
    filter:brightness(.72) blur(5px);
    transform:scale(1.012);
  }

  #dunkirkLayer{
    z-index:4;
    opacity:0;
    filter:brightness(.72) blur(5px);
    transform:scale(1.012);
  }

  .project-frame{
    display:block;
    width:100%;
    height:100%;
    border:0;
    background:#000;
    pointer-events:none;
  }

  /*
    This veil is the transition itself, not a separate "page".
    It rises over Interstellar, holds, then falls while TENET appears.
  */
  #cinemaVeil{
    position:fixed;
    inset:0;
    z-index:8;
    background:#000;
    opacity:0;
    pointer-events:none;
    will-change:opacity;
  }

  /* Always capture scroll on the parent, never inside iframe */
  #scrollCatcher{
    position:fixed;
    inset:0;
    z-index:20;
    background:transparent;
    pointer-events:auto;
    touch-action:pan-y;
  }
</style>
</head>
<body>

<div id="scrollSpace" aria-hidden="true"></div>

<div class="project-layer" id="interstellarLayer">
  <iframe
    class="project-frame"
    id="interstellarFrame"
    src="/interstellar-v20/"
    title="INTERSTELLAR — Time Study"
    tabindex="-1"
    loading="eager"></iframe>
</div>

<div class="project-layer" id="tenetLayer">
  <iframe
    class="project-frame"
    id="tenetFrame"
    src="./tenet.html"
    title="TENET — Time Direction Study"
    tabindex="-1"
    loading="eager"></iframe>
</div>

<div class="project-layer" id="dunkirkLayer">
  <iframe
    class="project-frame"
    id="dunkirkFrame"
    src="/dunkirk-v1/"
    title="DUNKIRK — Three Times / One Event"
    tabindex="-1"
    loading="eager"></iframe>
</div>

<div id="cinemaVeil" aria-hidden="true"></div>
<div id="scrollCatcher" aria-hidden="true"></div>

<script>
(() => {
  /*
    One continuous parent-owned timeline.

      0–1080      INTERSTELLAR
      1080–1170   hold final INTERSTELLAR frame
      1170–1340   fade INTERSTELLAR into black
      1340–1480   full black hold
      1480–1665   TENET emerges from black
      1665–2805   TENET

      2805–2895   hold final TENET frame
      2895–3065   fade TENET into black
      3065–3205   full black hold
      3205–3390   DUNKIRK emerges from black
      3390–4350   DUNKIRK

    The TENET → DUNKIRK bridge deliberately uses the same
    90 / 170 / 140 / 185vh rhythm as INTERSTELLAR → TENET.
  */
  const T = {
    interEnd:1080,
    interHoldEnd:1170,
    interFadeOutEnd:1340,
    interBlackHoldEnd:1480,
    tenetFadeInEnd:1665,
    tenetEnd:2805,
    tenetHoldEnd:2895,
    tenetFadeOutEnd:3065,
    tenetBlackHoldEnd:3205,
    dunkirkFadeInEnd:3390,
    dunkirkEnd:4350
  };

  const interLayer = document.getElementById('interstellarLayer');
  const tenetLayer = document.getElementById('tenetLayer');
  const dunkirkLayer = document.getElementById('dunkirkLayer');
  const veil = document.getElementById('cinemaVeil');

  const states = {
    inter:{
      frame:document.getElementById('interstellarFrame'),
      endSelector:'.ending',
      max:1,
      endY:0,
      ready:false
    },
    tenet:{
      frame:document.getElementById('tenetFrame'),
      endSelector:'.ending',
      max:1,
      endY:0,
      ready:false
    },
    dunkirk:{
      frame:document.getElementById('dunkirkFrame'),
      endSelector:null,
      max:1,
      endY:0,
      ready:false
    }
  };

  let raf=0;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

  function smooth(t){
    t=clamp(t,0,1);
    return t*t*(3-2*t);
  }

  function smoother(t){
    t=clamp(t,0,1);
    return t*t*t*(t*(t*6-15)+10);
  }

  function child(state){
    try{
      const win=state.frame.contentWindow;
      const doc=win&&win.document;
      if(!win||!doc||!doc.documentElement||!doc.body) return null;
      return {win,doc};
    }catch(e){return null}
  }

  function absoluteTop(el){
    let y=0;
    for(let n=el;n;n=n.offsetParent) y+=n.offsetTop||0;
    return y;
  }

  function prepare(state){
    const c=child(state);
    if(!c) return false;

    if(!c.doc.getElementById('combined-cinematic-style')){
      const style=c.doc.createElement('style');
      style.id='combined-cinematic-style';
      style.textContent=`
        html,body{
          scroll-behavior:auto!important;
          overflow-anchor:none!important;
          overscroll-behavior:none!important;
          scrollbar-width:none!important;
        }
        html::-webkit-scrollbar,
        body::-webkit-scrollbar{
          display:none!important;
          width:0!important;
          height:0!important;
        }
      `;
      c.doc.head.appendChild(style);
    }
    return true;
  }

  function measure(state){
    const c=child(state);
    if(!c) return false;
    prepare(state);

    const de=c.doc.documentElement;
    const body=c.doc.body;
    const documentHeight=Math.max(
      de.scrollHeight||0,
      de.offsetHeight||0,
      body.scrollHeight||0,
      body.offsetHeight||0,
      innerHeight
    );

    state.max=Math.max(documentHeight-innerHeight,1);

    const ending=state.endSelector ? c.doc.querySelector(state.endSelector) : null;
    if(ending){
      /*
        Center the actual final section, excluding document tail padding.
        Once frozen, this coordinate never changes while scrolling.
      */
      state.endY=clamp(
        absoluteTop(ending)+ending.offsetHeight*.5-innerHeight*.5,
        0,
        state.max
      );
    }else{
      state.endY=state.max;
    }

    state.ready=true;
    return true;
  }

  function scrollProject(state,p){
    const c=child(state);
    if(!c) return;
    if(!state.ready && !measure(state)) return;

    c.win.scrollTo(0,state.endY*clamp(p,0,1));
  }

  function render(){
    raf=0;
    const yVh=(window.scrollY/Math.max(innerHeight,1))*100;

    let interP=0;
    let tenetP=0;
    let dunkirkP=0;

    let interOpacity=0;
    let tenetOpacity=0;
    let dunkirkOpacity=0;
    let veilOpacity=0;

    let interBrightness=1;
    let interBlur=0;

    let tenetBrightness=.72;
    let tenetBlur=5;
    let tenetScale=1.012;

    let dunkirkBrightness=.72;
    let dunkirkBlur=5;
    let dunkirkScale=1.012;

    /* ---------- INTERSTELLAR ---------- */
    if(yVh < T.interEnd){
      interP=clamp(yVh/T.interEnd,0,1);
      interOpacity=1;

    }else if(yVh < T.interHoldEnd){
      interP=1;
      interOpacity=1;

    }else if(yVh < T.interFadeOutEnd){
      const p=smoother(
        (yVh-T.interHoldEnd)/(T.interFadeOutEnd-T.interHoldEnd)
      );
      interP=1;
      interOpacity=1-p*.96;
      veilOpacity=p;
      interBrightness=1-p*.58;
      interBlur=p*5;

    }else if(yVh < T.interBlackHoldEnd){
      interP=1;
      interOpacity=0;
      veilOpacity=1;

    }else if(yVh < T.tenetFadeInEnd){
      const p=smoother(
        (yVh-T.interBlackHoldEnd)/(T.tenetFadeInEnd-T.interBlackHoldEnd)
      );
      interP=1;
      tenetP=0;

      tenetOpacity=p;
      veilOpacity=1-p;
      tenetBrightness=.72+p*.28;
      tenetBlur=(1-p)*5;
      tenetScale=1.012-p*.012;

    /* ---------- TENET ---------- */
    }else if(yVh < T.tenetEnd){
      interP=1;
      tenetP=clamp(
        (yVh-T.tenetFadeInEnd)/(T.tenetEnd-T.tenetFadeInEnd),
        0,1
      );
      tenetOpacity=1;
      tenetBrightness=1;
      tenetBlur=0;
      tenetScale=1;

    }else if(yVh < T.tenetHoldEnd){
      interP=1;
      tenetP=1;
      tenetOpacity=1;
      tenetBrightness=1;
      tenetBlur=0;
      tenetScale=1;

    }else if(yVh < T.tenetFadeOutEnd){
      const p=smoother(
        (yVh-T.tenetHoldEnd)/(T.tenetFadeOutEnd-T.tenetHoldEnd)
      );
      interP=1;
      tenetP=1;

      tenetOpacity=1-p*.96;
      veilOpacity=p;
      tenetBrightness=1-p*.58;
      tenetBlur=p*5;
      tenetScale=1;

    }else if(yVh < T.tenetBlackHoldEnd){
      interP=1;
      tenetP=1;
      dunkirkP=0;

      tenetOpacity=0;
      dunkirkOpacity=0;
      veilOpacity=1;

    }else if(yVh < T.dunkirkFadeInEnd){
      const p=smoother(
        (yVh-T.tenetBlackHoldEnd)/(T.dunkirkFadeInEnd-T.tenetBlackHoldEnd)
      );
      interP=1;
      tenetP=1;
      dunkirkP=0;

      dunkirkOpacity=p;
      veilOpacity=1-p;
      dunkirkBrightness=.72+p*.28;
      dunkirkBlur=(1-p)*5;
      dunkirkScale=1.012-p*.012;

    /* ---------- DUNKIRK ---------- */
    }else{
      interP=1;
      tenetP=1;
      dunkirkP=clamp(
        (yVh-T.dunkirkFadeInEnd)/(T.dunkirkEnd-T.dunkirkFadeInEnd),
        0,1
      );

      dunkirkOpacity=1;
      veilOpacity=0;
      dunkirkBrightness=1;
      dunkirkBlur=0;
      dunkirkScale=1;
    }

    interLayer.style.opacity=interOpacity.toFixed(4);
    interLayer.style.filter=
      'brightness('+interBrightness.toFixed(4)+') blur('+interBlur.toFixed(2)+'px)';

    tenetLayer.style.opacity=tenetOpacity.toFixed(4);
    tenetLayer.style.filter=
      'brightness('+tenetBrightness.toFixed(4)+') blur('+tenetBlur.toFixed(2)+'px)';
    tenetLayer.style.transform='scale('+tenetScale.toFixed(5)+')';

    dunkirkLayer.style.opacity=dunkirkOpacity.toFixed(4);
    dunkirkLayer.style.filter=
      'brightness('+dunkirkBrightness.toFixed(4)+') blur('+dunkirkBlur.toFixed(2)+'px)';
    dunkirkLayer.style.transform='scale('+dunkirkScale.toFixed(5)+')';

    veil.style.opacity=veilOpacity.toFixed(4);

    scrollProject(states.inter,interP);
    scrollProject(states.tenet,tenetP);
    scrollProject(states.dunkirk,dunkirkP);
  }

  function requestRender(){
    if(!raf) raf=requestAnimationFrame(render);
  }

  function settle(state){
    state.ready=false;

    const run=()=>{
      measure(state);
      requestRender();
    };

    requestAnimationFrame(run);
    setTimeout(run,100);
    setTimeout(run,350);
    setTimeout(run,900);
    setTimeout(run,1600);

    const c=child(state);
    if(c&&c.doc.fonts&&c.doc.fonts.ready){
      c.doc.fonts.ready.then(run).catch(()=>{});
    }
  }

  Object.values(states).forEach(state=>{
    state.frame.addEventListener('load',()=>settle(state));

    try{
      const d=state.frame.contentDocument;
      if(d&&(d.readyState==='interactive'||d.readyState==='complete')){
        settle(state);
      }
    }catch(e){}
  });

  addEventListener('scroll',requestRender,{passive:true});
  addEventListener('wheel',requestRender,{passive:true});
  addEventListener('touchmove',requestRender,{passive:true});

  addEventListener('resize',()=>{
    settle(states.inter);
    settle(states.tenet);
    settle(states.dunkirk);
  });

  addEventListener('pageshow',requestRender);

  history.scrollRestoration='manual';
  requestRender();
})();
</script>
</body>
</html>
