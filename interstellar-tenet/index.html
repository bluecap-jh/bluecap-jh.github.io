<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>INTERSTELLAR → TENET → DUNKIRK → MEMENTO — Time Study</title>
<style>
  *{box-sizing:border-box}
  html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
  }
  html{
    overflow-x:hidden;
    overflow-y:scroll;
    scroll-behavior:auto;
  }
  body{overflow:visible}

  /* One parent-owned finite timeline */
  #scrollSpace{
    width:100%;
    height:8215vh;
    background:#000;
  }

  .project-layer{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#000;
    pointer-events:none;
    will-change:opacity,filter,transform;
    transform:translateZ(0);
  }

  #interstellarLayer{
    z-index:2;
    opacity:0;
    filter:brightness(1) blur(0px);
  }

  #tenetLayer{
    z-index:3;
    opacity:0;
    filter:brightness(.72) blur(5px);
    transform:scale(1.012);
  }

  #dunkirkLayer{
    z-index:4;
    opacity:0;
    filter:brightness(.72) blur(5px);
    transform:scale(1.012);
  }

  #mementoLayer{
    z-index:5;
    opacity:0;
    filter:brightness(.72) blur(5px);
    transform:scale(1.012);
  }

  .project-frame{
    display:block;
    width:100%;
    height:100%;
    border:0;
    background:#000;
    pointer-events:none;
  }

  /* ---------- FRONT COVER ---------- */
  #coverLayer{
    position:fixed;
    inset:0;
    z-index:7;
    display:grid;
    place-items:center;
    background:#000;
    color:#f2f2ef;
    pointer-events:none;
    opacity:1;
    will-change:opacity;
  }

  .cover-inner{
    width:min(860px,84vw);
    text-align:center;
    transform:translateY(0);
    opacity:1;
    will-change:opacity,transform;
  }

  .cover-kicker{
    margin-bottom:24px;
    font-size:10px;
    letter-spacing:.24em;
    color:rgba(255,255,255,.34);
  }

  .cover-title{
    margin:0;
    font-family:"Times New Roman",Times,serif;
    font-size:clamp(42px,6.2vw,84px);
    line-height:.96;
    font-weight:500;
    letter-spacing:-.055em;
  }

  .cover-copy{
    width:min(700px,82vw);
    margin:34px auto 0;
    font-family:"Pretendard","Noto Sans KR","Helvetica Neue",Arial,sans-serif;
    font-size:15px;
    line-height:1.8;
    letter-spacing:-.025em;
    color:rgba(255,255,255,.62);
    word-break:keep-all;
  }

  .cover-films{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px 18px;
    margin:34px auto 0;
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:11px;
    letter-spacing:.14em;
    color:rgba(255,255,255,.44);
  }

  .cover-films span:not(:last-child)::after{
    content:"·";
    display:inline-block;
    margin-left:18px;
    color:rgba(255,255,255,.18);
  }

  .cover-invite{
    margin-top:54px;
    font-family:"Pretendard","Noto Sans KR","Helvetica Neue",Arial,sans-serif;
    font-size:clamp(17px,1.7vw,22px);
    letter-spacing:-.025em;
    color:rgba(255,255,255,.88);
  }

  .cover-scroll{
    margin-top:20px;
    font-size:9px;
    letter-spacing:.22em;
    color:rgba(255,255,255,.20);
  }

  @media(max-width:680px){
    .cover-inner{width:86vw}
    .cover-copy{font-size:14px}
    .cover-films{
      max-width:290px;
      line-height:1.9;
    }
    .cover-films span:not(:last-child)::after{display:none}
    .cover-invite{margin-top:44px}
  }

  /*
    This veil is the transition itself, not a separate "page".
    It rises over Interstellar, holds, then falls while TENET appears.
  */
  #cinemaVeil{
    position:fixed;
    inset:0;
    z-index:8;
    background:#000;
    opacity:0;
    pointer-events:none;
    will-change:opacity;
  }

  /* Always capture scroll on the parent, never inside iframe */
  #scrollCatcher{
    position:fixed;
    inset:0;
    z-index:20;
    background:transparent;
    pointer-events:auto;
    touch-action:pan-y;
  }
</style>
</head>
<body>

<div id="scrollSpace" aria-hidden="true"></div>

<section id="coverLayer" aria-label="작품 소개">
  <div class="cover-inner" id="coverInner">
    <div class="cover-kicker">WELCOME / CHRISTOPHER NOLAN · TIME STUDY</div>
    <h1 class="cover-title">ARCHITECTURE OF TIME</h1>
    <p class="cover-copy">
      크리스토퍼 놀란 감독의 영화 중 촬영 기법 또는 이야기의 구조가
      ‘시간’과 밀접하게 연결된 네 작품을 골라 하나의 스크롤 경험으로 구성했습니다.
    </p>
    <div class="cover-films" aria-label="소개 작품">
      <span>INTERSTELLAR</span>
      <span>TENET</span>
      <span>DUNKIRK</span>
      <span>MEMENTO</span>
    </div>
    <div class="cover-invite">그러면, 한번 체험해 보실까요?</div>
    <div class="cover-scroll">SCROLL TO BEGIN</div>
  </div>
</section>

<div class="project-layer" id="interstellarLayer">
  <iframe
    class="project-frame"
    id="interstellarFrame"
    src="/interstellar-v20/"
    title="INTERSTELLAR — Time Study"
    tabindex="-1"
    loading="eager"></iframe>
</div>

<div class="project-layer" id="tenetLayer">
  <iframe
    class="project-frame"
    id="tenetFrame"
    src="./tenet.html"
    title="TENET — Time Direction Study"
    tabindex="-1"
    loading="eager"></iframe>
</div>

<div class="project-layer" id="dunkirkLayer">
  <iframe
    class="project-frame"
    id="dunkirkFrame"
    src="/dunkirk-v1/"
    title="DUNKIRK — Three Times / One Event"
    tabindex="-1"
    loading="eager"></iframe>
</div>

<div class="project-layer" id="mementoLayer">
  <iframe
    class="project-frame"
    id="mementoFrame"
    src="/memento-v1/"
    title="MEMENTO — Memory Order Study"
    tabindex="-1"
    loading="eager"></iframe>
</div>

<div id="cinemaVeil" aria-hidden="true"></div>
<div id="scrollCatcher" aria-hidden="true"></div>

<script>
(() => {
  /*
    One continuous parent-owned timeline.

      0–300       FRONT COVER
      300–470     cover copy fades into black
      470–600     full black hold
      600–785     INTERSTELLAR emerges from black

      785–1865    INTERSTELLAR
      1865–1955   hold final INTERSTELLAR frame
      1955–2125   fade INTERSTELLAR into black
      2125–2265   full black hold
      2265–2450   TENET emerges from black
      2450–3590   TENET

      3590–3680   hold final TENET frame
      3680–3850   fade TENET into black
      3850–3990   full black hold
      3990–4175   DUNKIRK emerges from black
      4175–5135   DUNKIRK

      5135–5225   hold final DUNKIRK frame
      5225–5395   fade DUNKIRK into black
      5395–5535   full black hold
      5535–5720   MEMENTO emerges from black
      5720–7535   MEMENTO

      7535–7625   hold final MEMENTO frame
      7625–7935   BACK COVER / slow fade to black
      7935–8115   full black ending
  */
  const T = {
    coverTextFadeStart:300,
    coverTextFadeEnd:470,
    coverBlackHoldEnd:600,
    interFadeInEnd:785,

    interEnd:1865,
    interHoldEnd:1955,
    interFadeOutEnd:2125,
    interBlackHoldEnd:2265,
    tenetFadeInEnd:2450,
    tenetEnd:3590,
    tenetHoldEnd:3680,
    tenetFadeOutEnd:3850,
    tenetBlackHoldEnd:3990,
    dunkirkFadeInEnd:4175,
    dunkirkEnd:5135,
    dunkirkHoldEnd:5225,
    dunkirkFadeOutEnd:5395,
    dunkirkBlackHoldEnd:5535,
    mementoFadeInEnd:5720,
    mementoEnd:7535,
    mementoHoldEnd:7625,
    mementoFadeOutEnd:7935,
    outroBlackEnd:8115
  };

  const coverLayer = document.getElementById('coverLayer');
  const coverInner = document.getElementById('coverInner');
  const interLayer = document.getElementById('interstellarLayer');
  const tenetLayer = document.getElementById('tenetLayer');
  const dunkirkLayer = document.getElementById('dunkirkLayer');
  const mementoLayer = document.getElementById('mementoLayer');
  const veil = document.getElementById('cinemaVeil');

  const states = {
    inter:{
      frame:document.getElementById('interstellarFrame'),
      endSelector:'.ending',
      max:1,
      endY:0,
      ready:false
    },
    tenet:{
      frame:document.getElementById('tenetFrame'),
      endSelector:'.ending',
      max:1,
      endY:0,
      ready:false
    },
    dunkirk:{
      frame:document.getElementById('dunkirkFrame'),
      endSelector:null,
      max:1,
      endY:0,
      ready:false
    },
    memento:{
      frame:document.getElementById('mementoFrame'),
      endSelector:null,
      max:1,
      endY:0,
      ready:false
    }
  };

  let raf=0;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

  function smooth(t){
    t=clamp(t,0,1);
    return t*t*(3-2*t);
  }

  function smoother(t){
    t=clamp(t,0,1);
    return t*t*t*(t*(t*6-15)+10);
  }

  function child(state){
    try{
      const win=state.frame.contentWindow;
      const doc=win&&win.document;
      if(!win||!doc||!doc.documentElement||!doc.body) return null;
      return {win,doc};
    }catch(e){return null}
  }

  function absoluteTop(el){
    let y=0;
    for(let n=el;n;n=n.offsetParent) y+=n.offsetTop||0;
    return y;
  }

  function prepare(state){
    const c=child(state);
    if(!c) return false;

    if(!c.doc.getElementById('combined-cinematic-style')){
      const style=c.doc.createElement('style');
      style.id='combined-cinematic-style';
      style.textContent=`
        html,body{
          scroll-behavior:auto!important;
          overflow-anchor:none!important;
          overscroll-behavior:none!important;
          scrollbar-width:none!important;
        }
        html::-webkit-scrollbar,
        body::-webkit-scrollbar{
          display:none!important;
          width:0!important;
          height:0!important;
        }
      `;
      c.doc.head.appendChild(style);
    }
    return true;
  }

  function measure(state){
    const c=child(state);
    if(!c) return false;
    prepare(state);

    const de=c.doc.documentElement;
    const body=c.doc.body;
    const documentHeight=Math.max(
      de.scrollHeight||0,
      de.offsetHeight||0,
      body.scrollHeight||0,
      body.offsetHeight||0,
      innerHeight
    );

    state.max=Math.max(documentHeight-innerHeight,1);

    const ending=state.endSelector ? c.doc.querySelector(state.endSelector) : null;
    if(ending){
      /*
        Center the actual final section, excluding document tail padding.
        Once frozen, this coordinate never changes while scrolling.
      */
      state.endY=clamp(
        absoluteTop(ending)+ending.offsetHeight*.5-innerHeight*.5,
        0,
        state.max
      );
    }else{
      state.endY=state.max;
    }

    state.ready=true;
    return true;
  }

  function scrollProject(state,p){
    const c=child(state);
    if(!c) return;
    if(!state.ready && !measure(state)) return;

    c.win.scrollTo(0,state.endY*clamp(p,0,1));
  }

  function render(){
    raf=0;
    const yVh=(window.scrollY/Math.max(innerHeight,1))*100;

    let coverOpacity=0;
    let coverInnerOpacity=0;
    let coverInnerY=0;

    let interP=0;
    let tenetP=0;
    let dunkirkP=0;
    let mementoP=0;

    let interOpacity=0;
    let tenetOpacity=0;
    let dunkirkOpacity=0;
    let mementoOpacity=0;
    let veilOpacity=0;

    let interBrightness=1;
    let interBlur=0;

    let tenetBrightness=.72;
    let tenetBlur=5;
    let tenetScale=1.012;

    let dunkirkBrightness=.72;
    let dunkirkBlur=5;
    let dunkirkScale=1.012;

    let mementoBrightness=.72;
    let mementoBlur=5;
    let mementoScale=1.012;

    /* ---------- FRONT COVER ---------- */
    if(yVh < T.coverTextFadeStart){
      coverOpacity=1;
      coverInnerOpacity=1;

    }else if(yVh < T.coverTextFadeEnd){
      const p=smoother(
        (yVh-T.coverTextFadeStart)/(T.coverTextFadeEnd-T.coverTextFadeStart)
      );
      coverOpacity=1;
      coverInnerOpacity=1-p;
      coverInnerY=-p*18;

    }else if(yVh < T.coverBlackHoldEnd){
      coverOpacity=1;
      coverInnerOpacity=0;

    }else if(yVh < T.interFadeInEnd){
      const p=smoother(
        (yVh-T.coverBlackHoldEnd)/(T.interFadeInEnd-T.coverBlackHoldEnd)
      );
      coverOpacity=1-p;
      coverInnerOpacity=0;
      interP=0;
      interOpacity=p;
      interBrightness=.72+p*.28;
      interBlur=(1-p)*5;

    /* ---------- INTERSTELLAR ---------- */
    }else if(yVh < T.interEnd){
      interP=clamp(
        (yVh-T.interFadeInEnd)/(T.interEnd-T.interFadeInEnd),
        0,1
      );
      interOpacity=1;

    }else if(yVh < T.interHoldEnd){
      interP=1;
      interOpacity=1;

    }else if(yVh < T.interFadeOutEnd){
      const p=smoother((yVh-T.interHoldEnd)/(T.interFadeOutEnd-T.interHoldEnd));
      interP=1;
      interOpacity=1-p*.96;
      veilOpacity=p;
      interBrightness=1-p*.58;
      interBlur=p*5;

    }else if(yVh < T.interBlackHoldEnd){
      interP=1;
      veilOpacity=1;

    }else if(yVh < T.tenetFadeInEnd){
      const p=smoother((yVh-T.interBlackHoldEnd)/(T.tenetFadeInEnd-T.interBlackHoldEnd));
      interP=1;
      tenetOpacity=p;
      veilOpacity=1-p;
      tenetBrightness=.72+p*.28;
      tenetBlur=(1-p)*5;
      tenetScale=1.012-p*.012;

    /* ---------- TENET ---------- */
    }else if(yVh < T.tenetEnd){
      interP=1;
      tenetP=clamp((yVh-T.tenetFadeInEnd)/(T.tenetEnd-T.tenetFadeInEnd),0,1);
      tenetOpacity=1;
      tenetBrightness=1;
      tenetBlur=0;
      tenetScale=1;

    }else if(yVh < T.tenetHoldEnd){
      interP=1;
      tenetP=1;
      tenetOpacity=1;
      tenetBrightness=1;
      tenetBlur=0;
      tenetScale=1;

    }else if(yVh < T.tenetFadeOutEnd){
      const p=smoother((yVh-T.tenetHoldEnd)/(T.tenetFadeOutEnd-T.tenetHoldEnd));
      interP=1;
      tenetP=1;
      tenetOpacity=1-p*.96;
      veilOpacity=p;
      tenetBrightness=1-p*.58;
      tenetBlur=p*5;
      tenetScale=1;

    }else if(yVh < T.tenetBlackHoldEnd){
      interP=1;
      tenetP=1;
      veilOpacity=1;

    }else if(yVh < T.dunkirkFadeInEnd){
      const p=smoother((yVh-T.tenetBlackHoldEnd)/(T.dunkirkFadeInEnd-T.tenetBlackHoldEnd));
      interP=1;
      tenetP=1;
      dunkirkOpacity=p;
      veilOpacity=1-p;
      dunkirkBrightness=.72+p*.28;
      dunkirkBlur=(1-p)*5;
      dunkirkScale=1.012-p*.012;

    /* ---------- DUNKIRK ---------- */
    }else if(yVh < T.dunkirkEnd){
      interP=1;
      tenetP=1;
      dunkirkP=clamp((yVh-T.dunkirkFadeInEnd)/(T.dunkirkEnd-T.dunkirkFadeInEnd),0,1);
      dunkirkOpacity=1;
      dunkirkBrightness=1;
      dunkirkBlur=0;
      dunkirkScale=1;

    }else if(yVh < T.dunkirkHoldEnd){
      interP=1;
      tenetP=1;
      dunkirkP=1;
      dunkirkOpacity=1;
      dunkirkBrightness=1;
      dunkirkBlur=0;
      dunkirkScale=1;

    }else if(yVh < T.dunkirkFadeOutEnd){
      const p=smoother((yVh-T.dunkirkHoldEnd)/(T.dunkirkFadeOutEnd-T.dunkirkHoldEnd));
      interP=1;
      tenetP=1;
      dunkirkP=1;
      dunkirkOpacity=1-p*.96;
      veilOpacity=p;
      dunkirkBrightness=1-p*.58;
      dunkirkBlur=p*5;
      dunkirkScale=1;

    }else if(yVh < T.dunkirkBlackHoldEnd){
      interP=1;
      tenetP=1;
      dunkirkP=1;
      veilOpacity=1;

    }else if(yVh < T.mementoFadeInEnd){
      const p=smoother((yVh-T.dunkirkBlackHoldEnd)/(T.mementoFadeInEnd-T.dunkirkBlackHoldEnd));
      interP=1;
      tenetP=1;
      dunkirkP=1;
      mementoOpacity=p;
      veilOpacity=1-p;
      mementoBrightness=.72+p*.28;
      mementoBlur=(1-p)*5;
      mementoScale=1.012-p*.012;

    /* ---------- MEMENTO ---------- */
    }else if(yVh < T.mementoEnd){
      interP=1;
      tenetP=1;
      dunkirkP=1;
      mementoP=clamp((yVh-T.mementoFadeInEnd)/(T.mementoEnd-T.mementoFadeInEnd),0,1);
      mementoOpacity=1;
      mementoBrightness=1;
      mementoBlur=0;
      mementoScale=1;

    }else if(yVh < T.mementoHoldEnd){
      interP=1;
      tenetP=1;
      dunkirkP=1;
      mementoP=1;
      mementoOpacity=1;
      mementoBrightness=1;
      mementoBlur=0;
      mementoScale=1;

    /* ---------- BACK COVER / FADE TO BLACK ---------- */
    }else if(yVh < T.mementoFadeOutEnd){
      const p=smoother(
        (yVh-T.mementoHoldEnd)/(T.mementoFadeOutEnd-T.mementoHoldEnd)
      );
      interP=1;
      tenetP=1;
      dunkirkP=1;
      mementoP=1;
      mementoOpacity=1-p*.98;
      mementoBrightness=1-p*.72;
      mementoBlur=p*4.5;
      mementoScale=1;
      veilOpacity=p;

    }else{
      interP=1;
      tenetP=1;
      dunkirkP=1;
      mementoP=1;
      mementoOpacity=0;
      veilOpacity=1;
    }

    coverLayer.style.opacity=coverOpacity.toFixed(4);
    coverInner.style.opacity=coverInnerOpacity.toFixed(4);
    coverInner.style.transform='translateY('+coverInnerY.toFixed(2)+'px)';

    interLayer.style.opacity=interOpacity.toFixed(4);
    interLayer.style.filter=
      'brightness('+interBrightness.toFixed(4)+') blur('+interBlur.toFixed(2)+'px)';

    tenetLayer.style.opacity=tenetOpacity.toFixed(4);
    tenetLayer.style.filter=
      'brightness('+tenetBrightness.toFixed(4)+') blur('+tenetBlur.toFixed(2)+'px)';
    tenetLayer.style.transform='scale('+tenetScale.toFixed(5)+')';

    dunkirkLayer.style.opacity=dunkirkOpacity.toFixed(4);
    dunkirkLayer.style.filter=
      'brightness('+dunkirkBrightness.toFixed(4)+') blur('+dunkirkBlur.toFixed(2)+'px)';
    dunkirkLayer.style.transform='scale('+dunkirkScale.toFixed(5)+')';

    mementoLayer.style.opacity=mementoOpacity.toFixed(4);
    mementoLayer.style.filter=
      'brightness('+mementoBrightness.toFixed(4)+') blur('+mementoBlur.toFixed(2)+'px)';
    mementoLayer.style.transform='scale('+mementoScale.toFixed(5)+')';

    veil.style.opacity=veilOpacity.toFixed(4);

    scrollProject(states.inter,interP);
    scrollProject(states.tenet,tenetP);
    scrollProject(states.dunkirk,dunkirkP);
    scrollProject(states.memento,mementoP);
  }

  function requestRender(){
    if(!raf) raf=requestAnimationFrame(render);
  }

  function settle(state){
    state.ready=false;

    const run=()=>{
      measure(state);
      requestRender();
    };

    requestAnimationFrame(run);
    setTimeout(run,100);
    setTimeout(run,350);
    setTimeout(run,900);
    setTimeout(run,1600);

    const c=child(state);
    if(c&&c.doc.fonts&&c.doc.fonts.ready){
      c.doc.fonts.ready.then(run).catch(()=>{});
    }
  }

  Object.values(states).forEach(state=>{
    state.frame.addEventListener('load',()=>settle(state));

    try{
      const d=state.frame.contentDocument;
      if(d&&(d.readyState==='interactive'||d.readyState==='complete')){
        settle(state);
      }
    }catch(e){}
  });

  addEventListener('scroll',requestRender,{passive:true});
  addEventListener('wheel',requestRender,{passive:true});
  addEventListener('touchmove',requestRender,{passive:true});

  addEventListener('resize',()=>{
    settle(states.inter);
    settle(states.tenet);
    settle(states.dunkirk);
    settle(states.memento);
  });

  addEventListener('pageshow',requestRender);

  history.scrollRestoration='manual';
  requestRender();
})();
</script>
</body>
</html>
