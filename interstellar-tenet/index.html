<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>INTERSTELLAR → TENET — Time Study</title>
<style>
  *{box-sizing:border-box}
  html,body{
    margin:0;
    background:#000;
    color:#fff;
    min-height:100%;
  }
  html{scroll-behavior:auto}
  body{
    overflow-x:hidden;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }

  .stage{
    position:relative;
    width:100%;
    min-height:100vh;
    background:#000;
  }

  .stage-sticky{
    position:sticky;
    top:0;
    width:100%;
    height:100vh;
    overflow:hidden;
    background:#000;
  }

  .project-frame{
    display:block;
    width:100%;
    height:100vh;
    border:0;
    background:#000;
    pointer-events:none;
  }

  .transition-gap{
    height:200vh;
    background:#000;
  }
</style>
</head>
<body>
  <section class="stage" id="interstellarStage" aria-label="Interstellar project">
    <div class="stage-sticky">
      <iframe
        class="project-frame"
        id="interstellarFrame"
        src="/interstellar-v20/"
        title="INTERSTELLAR — Time Study"
        loading="eager"></iframe>
    </div>
  </section>

  <div class="transition-gap" aria-hidden="true"></div>

  <section class="stage" id="tenetStage" aria-label="Tenet project">
    <div class="stage-sticky">
      <iframe
        class="project-frame"
        id="tenetFrame"
        src="./tenet.html"
        title="TENET — Time Direction Study"
        loading="eager"></iframe>
    </div>
  </section>

<script>
(() => {
  const pairs = [
    {
      stage: document.getElementById('interstellarStage'),
      frame: document.getElementById('interstellarFrame'),
      fallbackVh: 1150
    },
    {
      stage: document.getElementById('tenetStage'),
      frame: document.getElementById('tenetFrame'),
      fallbackVh: 1100
    }
  ];

  let raf = 0;

  function getChild(pair){
    try{
      const win = pair.frame.contentWindow;
      const doc = win && win.document;
      if(!win || !doc || !doc.documentElement || !doc.body) return null;
      return {win, doc};
    }catch(err){
      return null;
    }
  }

  function childHeight(doc){
    const de = doc.documentElement;
    const body = doc.body;
    return Math.max(
      de.scrollHeight || 0,
      de.offsetHeight || 0,
      body.scrollHeight || 0,
      body.offsetHeight || 0,
      innerHeight
    );
  }

  function prepareChild(pair){
    const child = getChild(pair);
    if(!child) return false;

    const {doc} = child;

    if(!doc.getElementById('combined-page-fixes')){
      const style = doc.createElement('style');
      style.id = 'combined-page-fixes';
      style.textContent = `
        html{
          scroll-behavior:auto !important;
          scrollbar-width:none !important;
        }
        body{
          scrollbar-width:none !important;
        }
        html::-webkit-scrollbar,
        body::-webkit-scrollbar{
          display:none !important;
          width:0 !important;
          height:0 !important;
        }
      `;
      doc.head.appendChild(style);
    }

    return true;
  }

  function lockStageLength(pair){
    if(pair.locked) return true;

    const child = getChild(pair);
    if(!child) return false;

    prepareChild(pair);

    const measured = childHeight(child.doc);

    /* Freeze the section length ONCE.
       After this point scroll-driven visual changes can never extend the section. */
    const safeHeight = Math.max(
      measured,
      innerHeight * (pair.fallbackVh / 100)
    );

    pair.stage.style.height = Math.round(safeHeight) + 'px';
    pair.lockedHeight = Math.round(safeHeight);
    pair.lockedChildMax = Math.max(measured - innerHeight, 1);
    pair.locked = true;

    return true;
  }

  function syncPair(pair){
    const child = getChild(pair);
    if(!child || !pair.locked) return;

    const stageTop = pair.stage.offsetTop;
    const stageTravel = Math.max(pair.lockedHeight - innerHeight, 1);
    const local = scrollY - stageTop;

    if(local < -innerHeight || local > pair.lockedHeight + innerHeight){
      return;
    }

    /* Normalize parent movement through this finite stage.
       At progress 1 the child is guaranteed to be at its actual bottom,
       and immediately after that the parent leaves the stage. */
    const progress = Math.max(0, Math.min(1, local / stageTravel));

    const currentMax = Math.max(childHeight(child.doc) - innerHeight, 1);
    const target = progress * currentMax;

    try{
      child.win.scrollTo(0, target);
    }catch(err){}
  }

  function sync(){
    raf = 0;
    pairs.forEach(syncPair);
  }

  function requestSync(){
    if(!raf) raf = requestAnimationFrame(sync);
  }

  function tryLockAll(){
    let ready = true;
    for(const pair of pairs){
      if(!pair.locked){
        if(!lockStageLength(pair)) ready = false;
      }
    }
    requestSync();
    return ready;
  }

  pairs.forEach(pair => {
    /* Temporary finite fallback: never allow an endless stage before load. */
    pair.stage.style.height = (pair.fallbackVh + 100) + 'vh';

    pair.frame.addEventListener('load', () => {
      pair.locked = false;

      [0, 120, 400, 900].forEach(delay => {
        setTimeout(() => {
          if(!pair.locked) lockStageLength(pair);
          requestSync();
        }, delay);
      });
    });
  });

  /* Same-origin frames may already be cached before the load listener fires. */
  let attempts = 0;
  const timer = setInterval(() => {
    attempts++;
    const done = tryLockAll();
    if(done || attempts >= 30){
      clearInterval(timer);
    }
  }, 150);

  addEventListener('scroll', requestSync, {passive:true});
  addEventListener('wheel', requestSync, {passive:true});
  addEventListener('touchmove', requestSync, {passive:true});

  addEventListener('resize', () => {
    /* Keep stage lengths finite; on viewport resize relock once. */
    pairs.forEach(pair => {
      pair.locked = false;
    });
    setTimeout(() => {
      pairs.forEach(lockStageLength);
      requestSync();
    }, 80);
  });

  addEventListener('pageshow', () => {
    setTimeout(() => {
      tryLockAll();
      requestSync();
    }, 50);
  });

  history.scrollRestoration = 'manual';
  requestSync();
})();
</script>
</body>
</html>
