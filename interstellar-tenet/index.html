<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>INTERSTELLAR → TENET — Time Study</title>
<style>
  *{box-sizing:border-box}
  html,body{
    margin:0;
    background:#000;
    color:#fff;
    min-height:100%;
  }
  html{scroll-behavior:auto}
  body{
    overflow-x:hidden;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }

  /*
    The parent page owns the entire scroll length.
    Child documents never determine or extend this height.
  */
  .scroll-segment{
    width:100%;
    background:#000;
  }
  #interstellarSegment{height:1200vh;}
  #blackGap{height:200vh;}
  #tenetSegment{height:1200vh;}

  .viewport-layer{
    position:fixed;
    inset:0;
    width:100%;
    height:100vh;
    background:#000;
    overflow:hidden;
    pointer-events:none;
    transition:opacity .12s linear;
    will-change:opacity;
  }

  #interstellarLayer{z-index:2;opacity:1;}
  #tenetLayer{z-index:3;opacity:0;}

  .project-frame{
    display:block;
    width:100%;
    height:100vh;
    border:0;
    background:#000;
    pointer-events:none;
  }

  .black-mask{
    position:fixed;
    inset:0;
    z-index:4;
    pointer-events:none;
    background:#000;
    opacity:0;
    will-change:opacity;
  }
</style>
</head>
<body>

  <div class="viewport-layer" id="interstellarLayer">
    <iframe
      class="project-frame"
      id="interstellarFrame"
      src="/interstellar-v20/"
      title="INTERSTELLAR — Time Study"
      loading="eager"></iframe>
  </div>

  <div class="viewport-layer" id="tenetLayer">
    <iframe
      class="project-frame"
      id="tenetFrame"
      src="./tenet.html"
      title="TENET — Time Direction Study"
      loading="eager"></iframe>
  </div>

  <div class="black-mask" id="blackMask" aria-hidden="true"></div>

  <main>
    <section class="scroll-segment" id="interstellarSegment" aria-label="Interstellar project scroll area"></section>
    <section class="scroll-segment" id="blackGap" aria-label="Black transition"></section>
    <section class="scroll-segment" id="tenetSegment" aria-label="Tenet project scroll area"></section>
  </main>

<script>
(() => {
  const interSegment = document.getElementById('interstellarSegment');
  const gap = document.getElementById('blackGap');
  const tenetSegment = document.getElementById('tenetSegment');

  const interLayer = document.getElementById('interstellarLayer');
  const tenetLayer = document.getElementById('tenetLayer');
  const blackMask = document.getElementById('blackMask');

  const interFrame = document.getElementById('interstellarFrame');
  const tenetFrame = document.getElementById('tenetFrame');

  let raf = 0;

  function clamp(v,a,b){
    return Math.max(a,Math.min(b,v));
  }

  function getChild(frame){
    try{
      const win = frame.contentWindow;
      const doc = win && win.document;
      if(!win || !doc || !doc.documentElement || !doc.body) return null;
      return {win,doc};
    }catch(err){
      return null;
    }
  }

  function childMaxScroll(child){
    const de = child.doc.documentElement;
    const body = child.doc.body;
    const height = Math.max(
      de.scrollHeight || 0,
      de.offsetHeight || 0,
      body.scrollHeight || 0,
      body.offsetHeight || 0,
      innerHeight
    );
    return Math.max(height - innerHeight, 1);
  }

  function prepareFrame(frame){
    const child = getChild(frame);
    if(!child) return;

    if(!child.doc.getElementById('combined-page-fixes')){
      const style = child.doc.createElement('style');
      style.id = 'combined-page-fixes';
      style.textContent = `
        html{scroll-behavior:auto !important;scrollbar-width:none !important;}
        body{scrollbar-width:none !important;}
        html::-webkit-scrollbar,
        body::-webkit-scrollbar{
          display:none !important;
          width:0 !important;
          height:0 !important;
        }
      `;
      child.doc.head.appendChild(style);
    }
  }

  function scrollChild(frame, progress){
    const child = getChild(frame);
    if(!child) return;
    const max = childMaxScroll(child);
    child.win.scrollTo(0, clamp(progress,0,1) * max);
  }

  function bounds(el){
    const top = el.offsetTop;
    return {
      top,
      height:el.offsetHeight,
      bottom:top + el.offsetHeight
    };
  }

  function render(){
    raf = 0;

    const y = window.scrollY || 0;
    const vh = innerHeight;

    const i = bounds(interSegment);
    const g = bounds(gap);
    const t = bounds(tenetSegment);

    /*
      Each segment has a finite parent-owned timeline.
      No child resize can ever push these boundaries farther down.
    */
    const interTravel = Math.max(i.height - vh, 1);
    const tenetTravel = Math.max(t.height - vh, 1);

    if(y < g.top){
      const p = clamp((y - i.top) / interTravel, 0, 1);

      interLayer.style.opacity = '1';
      tenetLayer.style.opacity = '0';
      blackMask.style.opacity = '0';

      scrollChild(interFrame, p);
      scrollChild(tenetFrame, 0);

    }else if(y < g.bottom){
      /*
        The black gap is truly empty.
        Both projects are explicitly invisible here, so Interstellar
        cannot reappear after its ending.
      */
      interLayer.style.opacity = '0';
      tenetLayer.style.opacity = '0';
      blackMask.style.opacity = '1';

      scrollChild(interFrame, 1);
      scrollChild(tenetFrame, 0);

    }else{
      const p = clamp((y - t.top) / tenetTravel, 0, 1);

      interLayer.style.opacity = '0';
      tenetLayer.style.opacity = '1';
      blackMask.style.opacity = '0';

      scrollChild(interFrame, 1);
      scrollChild(tenetFrame, p);
    }
  }

  function requestRender(){
    if(!raf) raf = requestAnimationFrame(render);
  }

  [interFrame,tenetFrame].forEach(frame=>{
    frame.addEventListener('load',()=>{
      prepareFrame(frame);
      requestRender();
      setTimeout(requestRender,100);
      setTimeout(requestRender,500);
    });
  });

  addEventListener('scroll',requestRender,{passive:true});
  addEventListener('wheel',requestRender,{passive:true});
  addEventListener('touchmove',requestRender,{passive:true});
  addEventListener('resize',requestRender);
  addEventListener('pageshow',requestRender);

  history.scrollRestoration='manual';
  requestRender();
})();
</script>
</body>
</html>
