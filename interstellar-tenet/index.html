<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>INTERSTELLAR → TENET — Time Study</title>
<style>
  *{box-sizing:border-box}
  html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
  }
  html{
    overflow-x:hidden;
    overflow-y:auto;
    scroll-behavior:auto;
  }
  body{overflow:visible}

  /*
    The parent has only one job: provide the 200vh black transition.
    300vh document height = 200vh maximum parent scroll distance.
  */
  #bridgeSpace{
    width:100%;
    height:300vh;
    background:#000;
  }

  .project-layer{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    background:#000;
    overflow:hidden;
    opacity:0;
    pointer-events:none;
  }

  #interstellarLayer{z-index:2}
  #tenetLayer{z-index:3}

  .project-layer.active{
    opacity:1;
    pointer-events:auto;
  }

  .project-frame{
    display:block;
    width:100%;
    height:100%;
    border:0;
    background:#000;
  }

  #blackMask{
    position:fixed;
    inset:0;
    z-index:4;
    background:#000;
    opacity:0;
    pointer-events:none;
  }

  #blackMask.active{opacity:1}
</style>
</head>
<body>

<div id="bridgeSpace" aria-hidden="true"></div>

<div class="project-layer active" id="interstellarLayer">
  <iframe
    class="project-frame"
    id="interstellarFrame"
    src="/interstellar-v20/"
    title="INTERSTELLAR — Time Study"
    loading="eager"></iframe>
</div>

<div class="project-layer" id="tenetLayer">
  <iframe
    class="project-frame"
    id="tenetFrame"
    src="./tenet.html"
    title="TENET — Time Direction Study"
    loading="eager"></iframe>
</div>

<div id="blackMask" aria-hidden="true"></div>

<script>
(() => {
  const interLayer = document.getElementById('interstellarLayer');
  const tenetLayer = document.getElementById('tenetLayer');
  const blackMask = document.getElementById('blackMask');

  const interFrame = document.getElementById('interstellarFrame');
  const tenetFrame = document.getElementById('tenetFrame');

  let maxBridge = 1;
  let mode = 'interstellar';

  function refreshBridge(){
    maxBridge = Math.max(
      document.documentElement.scrollHeight - innerHeight,
      1
    );
  }

  function setMode(next){
    mode = next;

    interLayer.classList.toggle('active', next === 'interstellar');
    tenetLayer.classList.toggle('active', next === 'tenet');
    blackMask.classList.toggle('active', next === 'gap');
  }

  function syncModeFromParent(){
    refreshBridge();

    const y = scrollY || 0;
    const edge = 2;

    if(y <= edge){
      setMode('interstellar');
    }else if(y >= maxBridge - edge){
      setMode('tenet');
    }else{
      setMode('gap');
    }
  }

  function childInfo(frame){
    try{
      const win = frame.contentWindow;
      const doc = win && win.document;
      if(!win || !doc || !doc.documentElement || !doc.body) return null;
      return {win,doc};
    }catch(err){
      return null;
    }
  }

  function prepareChild(frame, kind){
    const child = childInfo(frame);
    if(!child) return;

    const {win,doc} = child;

    if(!doc.getElementById('combined-native-scroll-fix')){
      const style = doc.createElement('style');
      style.id = 'combined-native-scroll-fix';
      style.textContent = `
        html,body{
          scroll-behavior:auto !important;
          overflow-anchor:none !important;
        }
      `;
      doc.head.appendChild(style);
    }

    if(win.__combinedBoundaryInstalled) return;
    win.__combinedBoundaryInstalled = true;

    /*
      Inside each project, scrolling is 100% native.
      Only when the project reaches its real boundary do we hand the
      wheel delta to the parent transition.
    */
    win.addEventListener('wheel', (event) => {
      const de = doc.documentElement;
      const body = doc.body;

      const max = Math.max(
        de.scrollHeight || 0,
        body.scrollHeight || 0
      ) - win.innerHeight;

      const y = win.scrollY || de.scrollTop || body.scrollTop || 0;
      const threshold = 3;

      if(kind === 'interstellar'){
        const atBottom = y >= max - threshold;

        if(atBottom && event.deltaY > 0){
          event.preventDefault();
          window.scrollBy(0, event.deltaY);
        }
      }

      if(kind === 'tenet'){
        const atTop = y <= threshold;

        if(atTop && event.deltaY < 0){
          event.preventDefault();
          window.scrollBy(0, event.deltaY);
        }
      }
    }, {passive:false});

    /*
      Trackpad momentum sometimes dispatches the next wheel frame to the
      parent immediately after the iframe is hidden. The parent handles
      the rest of the 200vh gap naturally.
    */
  }

  interFrame.addEventListener('load', () => {
    prepareChild(interFrame, 'interstellar');
  });

  tenetFrame.addEventListener('load', () => {
    prepareChild(tenetFrame, 'tenet');
  });

  /*
    Cached same-origin frames can already be complete before load listener.
  */
  setTimeout(() => {
    prepareChild(interFrame, 'interstellar');
    prepareChild(tenetFrame, 'tenet');
  }, 100);

  setTimeout(() => {
    prepareChild(interFrame, 'interstellar');
    prepareChild(tenetFrame, 'tenet');
  }, 700);

  addEventListener('scroll', syncModeFromParent, {passive:true});

  addEventListener('resize', () => {
    refreshBridge();
    syncModeFromParent();
  });

  addEventListener('pageshow', () => {
    refreshBridge();
    syncModeFromParent();
  });

  /*
    On the black gap, wheel scrolling belongs to the parent automatically.
    At the two edges the corresponding iframe becomes active again.
  */
  history.scrollRestoration = 'manual';
  scrollTo(0,0);
  refreshBridge();
  syncModeFromParent();
})();
</script>
</body>
</html>
