<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>INTERSTELLAR → TENET — Time Study</title>
<style>
  :root{
    --black:#000;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:var(--black);
  }
  html{
    overflow-x:hidden;
    overflow-y:scroll;
    scroll-behavior:auto;
  }
  body{
    overflow:visible;
  }

  /*
    One finite native document scroll.
    Nothing inside either iframe is allowed to capture wheel/touch input.
  */
  #scrollSpace{
    width:100%;
    height:2640vh;
    background:#000;
  }

  .project-layer{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#000;
    pointer-events:none;
    will-change:opacity;
  }

  #interstellarLayer{
    z-index:2;
    opacity:1;
  }

  #tenetLayer{
    z-index:3;
    opacity:0;
  }

  .project-frame{
    display:block;
    width:100%;
    height:100%;
    border:0;
    background:#000;
    pointer-events:none;
  }

  /*
    The catcher sits above the iframes. This is the cross-browser fix:
    Safari/Chrome/Firefox all send wheel and trackpad gestures to the root
    page instead of letting the embedded document consume them.
  */
  #scrollCatcher{
    position:fixed;
    inset:0;
    z-index:20;
    background:transparent;
    pointer-events:auto;
    touch-action:pan-y;
    cursor:default;
  }

  /*
    Transition black is separate from the catcher so its opacity can be
    animated without ever affecting input.
  */
  #blackTransition{
    position:fixed;
    inset:0;
    z-index:10;
    background:#000;
    pointer-events:none;
    opacity:0;
    will-change:opacity;
  }

  @media (prefers-reduced-motion:reduce){
    #interstellarLayer,
    #tenetLayer,
    #blackTransition{
      transition:none!important;
    }
  }
</style>
</head>
<body>

<div id="scrollSpace" aria-hidden="true"></div>

<div class="project-layer" id="interstellarLayer">
  <iframe
    class="project-frame"
    id="interstellarFrame"
    src="/interstellar-v20/"
    title="INTERSTELLAR — Time Study"
    tabindex="-1"
    loading="eager"></iframe>
</div>

<div class="project-layer" id="tenetLayer">
  <iframe
    class="project-frame"
    id="tenetFrame"
    src="./tenet.html"
    title="TENET — Time Direction Study"
    tabindex="-1"
    loading="eager"></iframe>
</div>

<div id="blackTransition" aria-hidden="true"></div>
<div id="scrollCatcher" aria-hidden="true"></div>

<script>
(() => {
  /*
    Parent timeline in vh units.

    0 ───────── 1050  : INTERSTELLAR native progression
    1050 ─────── 1120 : hold the final Interstellar frame
    1120 ─────── 1190 : fade Interstellar to black
    1190 ─────── 1370 : pure black pause
    1370 ─────── 1440 : TENET fades in from black
    1440 ─────── 2540 : TENET native progression

    The extra 100vh in #scrollSpace gives the root document the final
    viewport needed to reach 2540vh of actual scroll travel.
  */
  const T = {
    interEnd:1050,
    interHoldEnd:1120,
    fadeOutEnd:1190,
    blackEnd:1370,
    fadeInEnd:1440,
    tenetEnd:2540
  };

  const interLayer = document.getElementById('interstellarLayer');
  const tenetLayer = document.getElementById('tenetLayer');
  const blackTransition = document.getElementById('blackTransition');

  const states = {
    inter:{
      frame:document.getElementById('interstellarFrame'),
      endSelector:'.ending',
      max:0,
      endY:0,
      ready:false
    },
    tenet:{
      frame:document.getElementById('tenetFrame'),
      endSelector:'.ending',
      max:0,
      endY:0,
      ready:false
    }
  };

  let raf = 0;

  const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
  const smooth = t => {
    t=clamp(t,0,1);
    return t*t*(3-2*t);
  };

  function child(state){
    try{
      const win=state.frame.contentWindow;
      const doc=win && win.document;
      if(!win || !doc || !doc.documentElement || !doc.body) return null;
      return {win,doc};
    }catch(e){
      return null;
    }
  }

  function absoluteTop(el){
    let y=0;
    for(let n=el;n;n=n.offsetParent) y+=n.offsetTop||0;
    return y;
  }

  function prepare(state){
    const c=child(state);
    if(!c) return false;

    if(!c.doc.getElementById('combined-parent-scroll-style')){
      const style=c.doc.createElement('style');
      style.id='combined-parent-scroll-style';
      style.textContent=`
        html,body{
          scroll-behavior:auto!important;
          overflow-anchor:none!important;
          overscroll-behavior:none!important;
          scrollbar-width:none!important;
        }
        html::-webkit-scrollbar,
        body::-webkit-scrollbar{
          display:none!important;
          width:0!important;
          height:0!important;
        }
      `;
      c.doc.head.appendChild(style);
    }
    return true;
  }

  function measure(state){
    const c=child(state);
    if(!c) return false;
    prepare(state);

    const de=c.doc.documentElement;
    const body=c.doc.body;
    const documentHeight=Math.max(
      de.scrollHeight||0,
      de.offsetHeight||0,
      body.scrollHeight||0,
      body.offsetHeight||0,
      innerHeight
    );

    state.max=Math.max(documentHeight-innerHeight,1);

    const ending=c.doc.querySelector(state.endSelector);
    if(ending){
      /*
        Finish with the final section centered instead of using document bottom
        padding. This prevents the old "last screen → previous screen" jump.
      */
      state.endY=clamp(
        absoluteTop(ending)+ending.offsetHeight*.5-innerHeight*.5,
        0,
        state.max
      );
    }else{
      state.endY=state.max;
    }

    state.ready=true;
    return true;
  }

  function scrollProject(state,p){
    const c=child(state);
    if(!c) return;
    if(!state.ready && !measure(state)) return;

    /*
      Geometry is frozen into endY; render() never reads scrollHeight.
      That avoids Safari changing the destination while transforms animate.
    */
    c.win.scrollTo(0,state.endY*clamp(p,0,1));
  }

  function render(){
    raf=0;

    const yVh=(window.scrollY/Math.max(innerHeight,1))*100;

    let interOpacity=0;
    let tenetOpacity=0;
    let blackOpacity=0;
    let interP=0;
    let tenetP=0;

    if(yVh < T.interEnd){
      interOpacity=1;
      interP=clamp(yVh/T.interEnd,0,1);

    }else if(yVh < T.interHoldEnd){
      interOpacity=1;
      interP=1;

    }else if(yVh < T.fadeOutEnd){
      const p=smooth((yVh-T.interHoldEnd)/(T.fadeOutEnd-T.interHoldEnd));
      interOpacity=1-p;
      blackOpacity=p;
      interP=1;

    }else if(yVh < T.blackEnd){
      blackOpacity=1;
      interP=1;

    }else if(yVh < T.fadeInEnd){
      const p=smooth((yVh-T.blackEnd)/(T.fadeInEnd-T.blackEnd));
      tenetOpacity=p;
      blackOpacity=1-p;
      interP=1;
      tenetP=0;

    }else{
      tenetOpacity=1;
      interP=1;
      tenetP=clamp(
        (yVh-T.fadeInEnd)/(T.tenetEnd-T.fadeInEnd),
        0,
        1
      );
    }

    interLayer.style.opacity=interOpacity.toFixed(4);
    tenetLayer.style.opacity=tenetOpacity.toFixed(4);
    blackTransition.style.opacity=blackOpacity.toFixed(4);

    scrollProject(states.inter,interP);
    scrollProject(states.tenet,tenetP);
  }

  function requestRender(){
    if(!raf) raf=requestAnimationFrame(render);
  }

  function settle(state){
    state.ready=false;

    const run=()=>{
      measure(state);
      requestRender();
    };

    requestAnimationFrame(run);
    setTimeout(run,80);
    setTimeout(run,260);
    setTimeout(run,700);
    setTimeout(run,1400);

    const c=child(state);
    if(c && c.doc.fonts && c.doc.fonts.ready){
      c.doc.fonts.ready.then(run).catch(()=>{});
    }
  }

  Object.values(states).forEach(state=>{
    state.frame.addEventListener('load',()=>settle(state));

    try{
      const d=state.frame.contentDocument;
      if(d && (d.readyState==='interactive'||d.readyState==='complete')){
        settle(state);
      }
    }catch(e){}
  });

  /*
    The fixed transparent catcher is intentionally NOT preventing wheel/touch.
    Because it is part of the root document (not an iframe), native browser
    scrolling moves the parent page on Safari, Chrome, Firefox and mobile.
  */
  addEventListener('scroll',requestRender,{passive:true});
  addEventListener('wheel',requestRender,{passive:true});
  addEventListener('touchmove',requestRender,{passive:true});

  addEventListener('resize',()=>{
    settle(states.inter);
    settle(states.tenet);
  });

  addEventListener('pageshow',requestRender);

  history.scrollRestoration='manual';
  requestRender();
})();
</script>
</body>
</html>
