<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>INTERSTELLAR → TENET — Time Study</title>
<style>
  *{box-sizing:border-box}
  html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
  }
  html{
    overflow-x:hidden;
    overflow-y:scroll;
    scroll-behavior:auto;
  }
  body{overflow:visible}

  /* One parent-owned finite timeline */
  #scrollSpace{
    width:100%;
    height:3220vh;
    background:#000;
  }

  .project-layer{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#000;
    pointer-events:none;
    will-change:opacity,filter,transform;
    transform:translateZ(0);
  }

  #interstellarLayer{
    z-index:2;
    opacity:1;
    filter:brightness(1) blur(0px);
  }

  #tenetLayer{
    z-index:3;
    opacity:0;
    filter:brightness(.72) blur(5px);
    transform:scale(1.012);
  }

  .project-frame{
    display:block;
    width:100%;
    height:100%;
    border:0;
    background:#000;
    pointer-events:none;
  }

  /*
    This veil is the transition itself, not a separate "page".
    It rises over Interstellar, holds, then falls while TENET appears.
  */
  #cinemaVeil{
    position:fixed;
    inset:0;
    z-index:8;
    background:#000;
    opacity:0;
    pointer-events:none;
    will-change:opacity;
  }

  /* Always capture scroll on the parent, never inside iframe */
  #scrollCatcher{
    position:fixed;
    inset:0;
    z-index:20;
    background:transparent;
    pointer-events:auto;
    touch-action:pan-y;
  }
</style>
</head>
<body>

<div id="scrollSpace" aria-hidden="true"></div>

<div class="project-layer" id="interstellarLayer">
  <iframe
    class="project-frame"
    id="interstellarFrame"
    src="/interstellar-v20/"
    title="INTERSTELLAR — Time Study"
    tabindex="-1"
    loading="eager"></iframe>
</div>

<div class="project-layer" id="tenetLayer">
  <iframe
    class="project-frame"
    id="tenetFrame"
    src="./tenet.html"
    title="TENET — Time Direction Study"
    tabindex="-1"
    loading="eager"></iframe>
</div>

<div id="cinemaVeil" aria-hidden="true"></div>
<div id="scrollCatcher" aria-hidden="true"></div>

<script>
(() => {
  /*
    Long cinematic bridge:
      0–1080      Interstellar
      1080–1220   hold final Interstellar frame
      1220–1480   very slow fade to black
      1480–1700   full black hold
      1700–1980   very slow TENET fade-in
      1980–3120   TENET

    Total scrollSpace is +100vh so the final viewport can reach 3120vh.
  */
  const T = {
    interEnd:1080,
    interHoldEnd:1220,
    fadeOutEnd:1480,
    blackHoldEnd:1700,
    fadeInEnd:1980,
    tenetEnd:3120
  };

  const interLayer = document.getElementById('interstellarLayer');
  const tenetLayer = document.getElementById('tenetLayer');
  const veil = document.getElementById('cinemaVeil');

  const states = {
    inter:{
      frame:document.getElementById('interstellarFrame'),
      endSelector:'.ending',
      max:1,
      endY:0,
      ready:false
    },
    tenet:{
      frame:document.getElementById('tenetFrame'),
      endSelector:'.ending',
      max:1,
      endY:0,
      ready:false
    }
  };

  let raf=0;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

  function smooth(t){
    t=clamp(t,0,1);
    return t*t*(3-2*t);
  }

  function smoother(t){
    t=clamp(t,0,1);
    return t*t*t*(t*(t*6-15)+10);
  }

  function child(state){
    try{
      const win=state.frame.contentWindow;
      const doc=win&&win.document;
      if(!win||!doc||!doc.documentElement||!doc.body) return null;
      return {win,doc};
    }catch(e){return null}
  }

  function absoluteTop(el){
    let y=0;
    for(let n=el;n;n=n.offsetParent) y+=n.offsetTop||0;
    return y;
  }

  function prepare(state){
    const c=child(state);
    if(!c) return false;

    if(!c.doc.getElementById('combined-cinematic-style')){
      const style=c.doc.createElement('style');
      style.id='combined-cinematic-style';
      style.textContent=`
        html,body{
          scroll-behavior:auto!important;
          overflow-anchor:none!important;
          overscroll-behavior:none!important;
          scrollbar-width:none!important;
        }
        html::-webkit-scrollbar,
        body::-webkit-scrollbar{
          display:none!important;
          width:0!important;
          height:0!important;
        }
      `;
      c.doc.head.appendChild(style);
    }
    return true;
  }

  function measure(state){
    const c=child(state);
    if(!c) return false;
    prepare(state);

    const de=c.doc.documentElement;
    const body=c.doc.body;
    const documentHeight=Math.max(
      de.scrollHeight||0,
      de.offsetHeight||0,
      body.scrollHeight||0,
      body.offsetHeight||0,
      innerHeight
    );

    state.max=Math.max(documentHeight-innerHeight,1);

    const ending=c.doc.querySelector(state.endSelector);
    if(ending){
      /*
        Center the actual final section, excluding document tail padding.
        Once frozen, this coordinate never changes while scrolling.
      */
      state.endY=clamp(
        absoluteTop(ending)+ending.offsetHeight*.5-innerHeight*.5,
        0,
        state.max
      );
    }else{
      state.endY=state.max;
    }

    state.ready=true;
    return true;
  }

  function scrollProject(state,p){
    const c=child(state);
    if(!c) return;
    if(!state.ready && !measure(state)) return;

    c.win.scrollTo(0,state.endY*clamp(p,0,1));
  }

  function render(){
    raf=0;
    const yVh=(window.scrollY/Math.max(innerHeight,1))*100;

    let interP=0;
    let tenetP=0;

    let interOpacity=0;
    let tenetOpacity=0;
    let veilOpacity=0;

    let interBrightness=1;
    let interBlur=0;
    let tenetBrightness=.72;
    let tenetBlur=5;
    let tenetScale=1.012;

    if(yVh < T.interEnd){
      interP=clamp(yVh/T.interEnd,0,1);
      interOpacity=1;

    }else if(yVh < T.interHoldEnd){
      /* Hold the final Interstellar frame perfectly still */
      interP=1;
      interOpacity=1;

    }else if(yVh < T.fadeOutEnd){
      /* Interstellar slowly sinks into black over 260vh */
      const p=smoother((yVh-T.interHoldEnd)/(T.fadeOutEnd-T.interHoldEnd));
      interP=1;
      interOpacity=1-p*.96;
      veilOpacity=p;
      interBrightness=1-p*.58;
      interBlur=p*5;

    }else if(yVh < T.blackHoldEnd){
      /* No page here — just one continuous black transition */
      interP=1;
      tenetP=0;
      interOpacity=0;
      tenetOpacity=0;
      veilOpacity=1;

    }else if(yVh < T.fadeInEnd){
      /* TENET emerges slowly out of the same black frame */
      const p=smoother((yVh-T.blackHoldEnd)/(T.fadeInEnd-T.blackHoldEnd));
      interP=1;
      tenetP=0;

      interOpacity=0;
      tenetOpacity=p;
      veilOpacity=1-p;

      tenetBrightness=.72+p*.28;
      tenetBlur=(1-p)*5;
      tenetScale=1.012-(p*.012);

    }else{
      interP=1;
      tenetP=clamp(
        (yVh-T.fadeInEnd)/(T.tenetEnd-T.fadeInEnd),
        0,
        1
      );
      tenetOpacity=1;
      veilOpacity=0;
      tenetBrightness=1;
      tenetBlur=0;
      tenetScale=1;
    }

    interLayer.style.opacity=interOpacity.toFixed(4);
    interLayer.style.filter=
      'brightness('+interBrightness.toFixed(4)+') blur('+interBlur.toFixed(2)+'px)';

    tenetLayer.style.opacity=tenetOpacity.toFixed(4);
    tenetLayer.style.filter=
      'brightness('+tenetBrightness.toFixed(4)+') blur('+tenetBlur.toFixed(2)+'px)';
    tenetLayer.style.transform='scale('+tenetScale.toFixed(5)+')';

    veil.style.opacity=veilOpacity.toFixed(4);

    scrollProject(states.inter,interP);
    scrollProject(states.tenet,tenetP);
  }

  function requestRender(){
    if(!raf) raf=requestAnimationFrame(render);
  }

  function settle(state){
    state.ready=false;

    const run=()=>{
      measure(state);
      requestRender();
    };

    requestAnimationFrame(run);
    setTimeout(run,100);
    setTimeout(run,350);
    setTimeout(run,900);
    setTimeout(run,1600);

    const c=child(state);
    if(c&&c.doc.fonts&&c.doc.fonts.ready){
      c.doc.fonts.ready.then(run).catch(()=>{});
    }
  }

  Object.values(states).forEach(state=>{
    state.frame.addEventListener('load',()=>settle(state));

    try{
      const d=state.frame.contentDocument;
      if(d&&(d.readyState==='interactive'||d.readyState==='complete')){
        settle(state);
      }
    }catch(e){}
  });

  addEventListener('scroll',requestRender,{passive:true});
  addEventListener('wheel',requestRender,{passive:true});
  addEventListener('touchmove',requestRender,{passive:true});

  addEventListener('resize',()=>{
    settle(states.inter);
    settle(states.tenet);
  });

  addEventListener('pageshow',requestRender);

  history.scrollRestoration='manual';
  requestRender();
})();
</script>
</body>
</html>
