<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>INTERSTELLAR → TENET — Time Study</title>
<style>
  *{box-sizing:border-box}
  html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
  }
  html{
    overflow-y:scroll;
    overflow-x:hidden;
    scroll-behavior:auto;
  }
  body{
    overflow:visible;
  }

  /* Parent page has an explicit finite scroll length. */
  #scrollSpace{
    position:relative;
    width:100%;
    height:2600vh;
    background:#000;
  }

  .viewport-layer{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#000;
    pointer-events:none;
  }

  #interstellarLayer{
    z-index:2;
    opacity:1;
  }

  #tenetLayer{
    z-index:3;
    opacity:0;
  }

  .project-frame{
    display:block;
    width:100vw;
    height:100vh;
    border:0;
    background:#000;
    pointer-events:none;
  }

  #blackMask{
    position:fixed;
    inset:0;
    z-index:4;
    background:#000;
    opacity:0;
    pointer-events:none;
  }
</style>
</head>
<body>

<div id="scrollSpace" aria-hidden="true"></div>

<div class="viewport-layer" id="interstellarLayer">
  <iframe
    class="project-frame"
    id="interstellarFrame"
    src="/interstellar-v20/"
    title="INTERSTELLAR — Time Study"
    tabindex="-1"></iframe>
</div>

<div class="viewport-layer" id="tenetLayer">
  <iframe
    class="project-frame"
    id="tenetFrame"
    src="./tenet.html"
    title="TENET — Time Direction Study"
    tabindex="-1"></iframe>
</div>

<div id="blackMask"></div>

<script>
(() => {
  const INTER_END = 1200; // vh
  const GAP_END = 1400;   // vh (200vh black gap)
  const TOTAL_END = 2600; // vh

  const interLayer = document.getElementById('interstellarLayer');
  const tenetLayer = document.getElementById('tenetLayer');
  const blackMask = document.getElementById('blackMask');

  const interFrame = document.getElementById('interstellarFrame');
  const tenetFrame = document.getElementById('tenetFrame');

  const state = {
    interMax: null,
    tenetMax: null,
    raf: 0
  };

  const clamp = (v,a,b) => Math.max(a,Math.min(b,v));

  function getChild(frame){
    try{
      const win = frame.contentWindow;
      const doc = win && win.document;
      if(!win || !doc || !doc.documentElement || !doc.body) return null;
      return {win,doc};
    }catch(e){
      return null;
    }
  }

  function measureMax(frame){
    const child = getChild(frame);
    if(!child) return null;
    const de = child.doc.documentElement;
    const body = child.doc.body;
    const h = Math.max(
      de.scrollHeight || 0,
      de.offsetHeight || 0,
      body.scrollHeight || 0,
      body.offsetHeight || 0,
      innerHeight
    );
    return Math.max(h - innerHeight, 0);
  }

  function prepareFrame(frame){
    const child = getChild(frame);
    if(!child) return;
    const {doc} = child;

    if(!doc.getElementById('combined-scroll-fix')){
      const style = doc.createElement('style');
      style.id = 'combined-scroll-fix';
      style.textContent = `
        html,body{
          scroll-behavior:auto !important;
          overscroll-behavior:none !important;
          overflow-anchor:none !important;
          scrollbar-width:none !important;
        }
        html::-webkit-scrollbar,
        body::-webkit-scrollbar{
          display:none !important;
          width:0 !important;
          height:0 !important;
        }
      `;
      doc.head.appendChild(style);
    }
  }

  function cacheHeights(){
    const a = measureMax(interFrame);
    const b = measureMax(tenetFrame);
    if(a !== null && a > 0) state.interMax = a;
    if(b !== null && b > 0) state.tenetMax = b;
  }

  function childScroll(frame, target){
    const child = getChild(frame);
    if(!child) return;
    child.win.scrollTo(0, Math.max(0,target));
  }

  function render(){
    state.raf = 0;

    const yVh = (window.scrollY / Math.max(innerHeight,1)) * 100;

    if(yVh < INTER_END){
      interLayer.style.opacity = '1';
      tenetLayer.style.opacity = '0';
      blackMask.style.opacity = '0';

      const p = clamp(yVh / INTER_END, 0, 1);
      const max = state.interMax ?? measureMax(interFrame) ?? 0;
      childScroll(interFrame, p * max);
      childScroll(tenetFrame, 0);

    }else if(yVh < GAP_END){
      interLayer.style.opacity = '0';
      tenetLayer.style.opacity = '0';
      blackMask.style.opacity = '1';

      const max = state.interMax ?? 0;
      childScroll(interFrame, max);
      childScroll(tenetFrame, 0);

    }else{
      interLayer.style.opacity = '0';
      tenetLayer.style.opacity = '1';
      blackMask.style.opacity = '0';

      const p = clamp((yVh - GAP_END) / (TOTAL_END - GAP_END), 0, 1);
      const max = state.tenetMax ?? measureMax(tenetFrame) ?? 0;
      childScroll(interFrame, state.interMax ?? 0);
      childScroll(tenetFrame, p * max);
    }
  }

  function requestRender(){
    if(!state.raf) state.raf = requestAnimationFrame(render);
  }

  function initFrame(frame){
    prepareFrame(frame);
    cacheHeights();
    requestRender();
  }

  interFrame.addEventListener('load',()=>initFrame(interFrame));
  tenetFrame.addEventListener('load',()=>initFrame(tenetFrame));

  addEventListener('scroll',requestRender,{passive:true});
  addEventListener('wheel',requestRender,{passive:true});
  addEventListener('touchmove',requestRender,{passive:true});

  addEventListener('resize',()=>{
    cacheHeights();
    requestRender();
  });

  addEventListener('pageshow',()=>{
    cacheHeights();
    requestRender();
  });

  setTimeout(()=>{cacheHeights();requestRender();},100);
  setTimeout(()=>{cacheHeights();requestRender();},500);
  setTimeout(()=>{cacheHeights();requestRender();},1200);

  requestRender();
})();
</script>
</body>
</html>
