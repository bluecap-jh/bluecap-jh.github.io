<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MEMENTO — New Study</title>
<style>
  *{box-sizing:border-box}
  html,body{
    margin:0;
    min-height:100%;
    background:#000;
    color:#f2f2ef;
    font-family:"Pretendard","Noto Sans KR","Helvetica Neue",Arial,sans-serif;
  }
  body{
    overflow-x:hidden;
  }
  .stage{
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:8vh 8vw;
    background:#000;
  }
  .intro{
    width:min(980px,90vw);
    text-align:center;
  }
  .eyebrow{
    display:block;
    margin-bottom:18px;
    font-size:9px;
    letter-spacing:.24em;
    color:rgba(255,255,255,.30);
  }
  h1{
    margin:0;
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(76px,11vw,160px);
    line-height:.92;
    font-weight:500;
    letter-spacing:-.055em;
  }
  p{
    width:min(720px,82vw);
    margin:30px auto 0;
    font-size:13px;
    line-height:1.8;
    color:rgba(255,255,255,.46);
    word-break:keep-all;
  }
  .reset{
    margin-top:30px;
    font-size:9px;
    letter-spacing:.18em;
    color:rgba(255,255,255,.20);
  }
</style>
</head>
<body>
  <main class="stage">
    <section class="intro">
      <span class="eyebrow">CHRISTOPHER NOLAN / NEW MEMORY STUDY</span>
      <h1>Memento</h1>
      <p>기존 페이지를 폐기하고 새로운 구조를 시작합니다.</p>
      <div class="reset">RESET / NEW DIRECTION</div>
    </section>
  </main>
</body>
</html>
